stale_data_window_seconds: 300
future_timestamp_skew_seconds: 60

metrics:
  latency_ms:
    unit: "ms"
    min: 0.0
    max: 10000.0
    baseline: 12.0
    warning_threshold: 80.0
    critical_threshold: 250.0
    description: "Round-trip network latency in milliseconds"

  jitter_ms:
    unit: "ms"
    min: 0.0
    max: 5000.0
    baseline: 2.5
    warning_threshold: 20.0
    critical_threshold: 60.0
    description: "Statistical variance in packet arrival time"

  packet_loss_pct:
    unit: "%"
    min: 0.0
    max: 100.0
    baseline: 0.0
    warning_threshold: 1.5
    critical_threshold: 5.0
    description: "Percentage of transmitted packets lost in transit"

  throughput_mbps:
    unit: "Mbps"
    min: 0.0
    max: 100000.0
    baseline: 450.0
    warning_threshold: 850.0
    critical_threshold: 980.0
    description: "Effective data transfer rate through the interface"

  bandwidth_mbps:
    unit: "Mbps"
    min: 0.0
    max: 100000.0
    baseline: 1000.0
    warning_threshold: null
    critical_threshold: null
    description: "Nominal channel capacity of the link"

  link_utilization_pct:
    unit: "%"
    min: 0.0
    max: 100.0
    baseline: 35.0
    warning_threshold: 80.0
    critical_threshold: 95.0
    description: "Percentage of available bandwidth currently utilized"

  cpu_pct:
    unit: "%"
    min: 0.0
    max: 100.0
    baseline: 25.0
    warning_threshold: 75.0
    critical_threshold: 90.0
    description: "Processor utilization percentage of the network device"

  memory_pct:
    unit: "%"
    min: 0.0
    max: 100.0
    baseline: 40.0
    warning_threshold: 80.0
    critical_threshold: 92.0
    description: "System memory utilization percentage of the device"

  queue_drops:
    unit: "packets"
    min: 0
    max: 10000000
    baseline: 0
    warning_threshold: 10
    critical_threshold: 100
    description: "Packets discarded due to output buffer congestion"

  interface_errors:
    unit: "errors"
    min: 0
    max: 10000000
    baseline: 0
    warning_threshold: 5
    critical_threshold: 50
    description: "Physical or framing errors (CRC, alignment, runts)"

  rssi_dbm:
    unit: "dBm"
    min: -120.0
    max: 0.0
    baseline: -55.0
    warning_threshold: -75.0
    critical_threshold: -85.0
    description: "Received Signal Strength Indicator for wireless links"

  snr_db:
    unit: "dB"
    min: 0.0
    max: 100.0
    baseline: 35.0
    warning_threshold: 20.0
    critical_threshold: 12.0
    description: "Signal to Noise Ratio for wireless connections"

  retransmission_pct:
    unit: "%"
    min: 0.0
    max: 100.0
    baseline: 1.0
    warning_threshold: 8.0
    critical_threshold: 20.0
    description: "Percentage of Wi-Fi or TCP frames retransmitted"

  device_status:
    unit: "enum"
    allowed_values: ["up", "down", "degraded"]
    baseline: "up"
    description: "Operational status of the network node"

  dns_resolution_ms:
    unit: "ms"
    min: 0.0
    max: 30000.0
    baseline: 15.0
    warning_threshold: 150.0
    critical_threshold: 1000.0
    description: "Time to resolve standard campus DNS queries"

  dhcp_failures:
    unit: "events"
    min: 0
    max: 100000
    baseline: 0
    warning_threshold: 5
    critical_threshold: 25
    description: "Failed or timed-out DHCP lease requests"

campus_segments:
  hostel_wifi:
    default_bandwidth_mbps: 1000.0
    max_ap_clients: 80
  dept_ethernet:
    default_bandwidth_mbps: 1000.0
  lhc:
    default_bandwidth_mbps: 1000.0
  core:
    default_bandwidth_mbps: 10000.0
  distribution:
    default_bandwidth_mbps: 10000.0
  datacenter:
    default_bandwidth_mbps: 10000.0
  uplink:
    default_bandwidth_mbps: 20000.0
